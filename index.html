<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Stuff</title>
<script>
(function(){try{var t=localStorage.getItem("school_stuff_theme");if(t==="light"||t==="dark"||t==="paper")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* tokens (same palette as shared/look.css): light, dark (auto or forced), paper */
:root{
  --paper:#F2EDE3; --surface:#FBF8F1; --surface2:#E9E2D3;
  --ink:#211C15; --ink2:#645B4C; --line:#D7CEBB; --line2:#B8AC92;
  --shadow:0 10px 34px rgb(50 39 20 / 8%);
  --use-d:0; color-scheme:light;
  --f-disp:"Newsreader",Georgia,serif;
  --f-ui:"Work Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,32px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="paper"]){
    --paper:#171410; --surface:#201C16; --surface2:#2A241B;
    --ink:#EEE7DA; --ink2:#B9B09E; --line:#3D3528; --line2:#5A4F3B;
    --shadow:0 10px 34px rgb(0 0 0 / 28%);
    --use-d:1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#171410; --surface:#201C16; --surface2:#2A241B;
  --ink:#EEE7DA; --ink2:#B9B09E; --line:#3D3528; --line2:#5A4F3B;
  --shadow:0 10px 34px rgb(0 0 0 / 28%);
  --use-d:1; color-scheme:dark;
}
:root[data-theme="paper"]{
  --paper:#F0E4C8; --surface:#F8EFD9; --surface2:#E7D8B5;
  --ink:#3A2D1E; --ink2:#6B5A42; --line:#D6C59F; --line2:#B9A474;
  --shadow:0 10px 30px rgb(95 70 20 / 10%);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--paper)}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
:root[data-theme="paper"] body{line-height:1.7}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ink2);outline-offset:3px}

.site-top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1340px;margin:0 auto;
  padding:14px var(--gut);min-height:76px;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-disp);font-size:1.2rem;font-weight:600}
.brand-mark{width:35px;height:35px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:50%;font:500 13px var(--f-mono)}
.themebtn{min-height:46px;min-width:46px;padding:8px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);
  color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;font:600 .95rem var(--f-ui);text-transform:capitalize}
.themebtn:hover{border-color:var(--ink2)}
.themebtn svg{flex:none}

main{max-width:1340px;margin:0 auto;padding:clamp(40px,7vw,90px) var(--gut) 40px}
.hero{display:grid;grid-template-columns:1fr 1fr;column-gap:80px;align-items:end;margin-bottom:clamp(36px,5vw,64px)}
.eyebrow,.module-code,.type-tag{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;font-weight:500}
.hero .eyebrow{grid-column:1;color:var(--ink2);margin:0 0 14px}
.hero h1{grid-column:1;font-size:clamp(3rem,5.6vw,5.2rem);line-height:1.02}
.hero-copy{grid-column:2;grid-row:1 / span 2;max-width:580px;font-family:var(--f-disp);font-size:clamp(1.25rem,2vw,1.55rem);line-height:1.4;margin:0;color:var(--ink)}
.jumps{grid-column:1 / -1;display:flex;gap:9px;flex-wrap:wrap;margin-top:36px}
.jump{min-height:44px;display:inline-flex;align-items:center;padding:8px 15px;border-radius:99px;border:1px solid var(--line2);
  font:500 .78rem var(--f-mono);background:var(--surface)}
.jump::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--m);margin-right:9px}
.jump:hover{border-color:var(--m)}

.shelf{columns:520px 2;column-gap:24px}
.module{--m:var(--a-l);position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);break-inside:avoid;margin-bottom:24px;scroll-margin-top:16px}
.module::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--m)}
.module-index{position:absolute;right:23px;top:11px;font:500 3.5rem var(--f-disp);color:color-mix(in srgb,var(--m) 24%,transparent);line-height:1}
.module-head{min-height:140px;padding:28px 80px 22px 30px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.module-code{color:var(--m);margin:0}
.module-head h2{font-size:clamp(1.6rem,2.4vw,2rem);margin:7px 0 0;line-height:1.15}
.page-count{color:var(--ink2);font-size:.82rem}
.pages{border-top:1px solid var(--line)}
.pages .sec{margin:0;padding:14px 23px 8px 30px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--m);border-bottom:1px solid var(--line)}
.page{display:grid;grid-template-columns:62px 1fr 22px;gap:17px;align-items:start;min-height:64px;padding:20px 23px 20px 30px;
  border-bottom:1px solid var(--line);transition:background .12s}
.page:last-child{border-bottom:0}
.page:hover{background:color-mix(in srgb,var(--m) 7%,transparent)}
.type-tag{color:var(--m);font-size:.67rem;border:1px solid color-mix(in srgb,var(--m) 50%,transparent);border-radius:4px;padding:4px 5px;text-align:center}
.page-copy strong{display:block;font-family:var(--f-disp);font-size:1.25rem;font-weight:500;margin-bottom:4px;line-height:1.2}
.page-copy small{display:block;color:var(--ink2);line-height:1.5;font-size:.9rem}
.go{margin-top:3px;color:var(--m);transition:transform .15s}
.page:hover .go{transform:translateX(3px)}

footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--ink2);border-top:1px solid var(--line);
  margin-top:48px;padding:25px 0;font-size:.85rem}

@media (min-width:1200px){ body{font-size:17px} .page-copy small{font-size:.95rem} }
@media (max-width:800px){
  .hero{display:block}
  .hero h1{font-size:3.6rem}
  .hero-copy{margin-top:20px}
  .jumps{margin-top:26px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px}
  .jump{flex:none}
  .module-index{font-size:3rem}
  .module-head{min-height:120px;padding:24px 70px 20px 24px}
  .page{grid-template-columns:54px 1fr 18px;gap:12px;padding:18px 16px 18px 24px}
  .themebtn span{display:none}
  .brand span:last-child{font-size:1.1rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.page,.go{transition:none}}
</style>
</head>
<body>

<header class="site-top">
  <a class="brand" href="./" aria-label="School Stuff home"><span class="brand-mark" aria-hidden="true">S</span><span>School Stuff</span></a>
  <button class="themebtn" id="themebtn" type="button" aria-label="Switch theme" title="Switch theme"></button>
</header>

<main>
  <section class="hero" aria-labelledby="h">
    <p class="eyebrow">Your study shelf</p>
    <h1 id="h">Pick a module.</h1>
    <p class="hero-copy">Study guides and quizzes for each course, kept in one shelf. Every module gets its own page — open one below.</p>
    <nav class="jumps" id="jump" aria-label="Jump to a module"></nav>
  </section>

  <div class="shelf" id="shelf" role="list"></div>

  <footer>
    <span>New modules get added to this shelf as they're built — nothing to configure.</span>
    <span id="stats"></span>
  </footer>
</main>

<script>
(function(){
  "use strict";

  // Add a new module here — one object, no other changes needed.
  var MODULES = [
    {
      code: "ICNF102",
      name: "Communication Network Fundamentals",
      tint: "#9C4A2E",
      tintDark: "#E0916E",
      sites: [
        { label: "Field reference", tag: "Guide", href: "icnf102-study-guide/",
          desc: "21-sheet study guide — explanations, worked examples and cheat sheets. No questions." },
        { label: "Line Test", tag: "Quiz", href: "icnf102-quiz/",
          desc: "200 questions in 8 sets, rising in difficulty. Study and test modes." },
        { label: "Subnet Bench", tag: "Drill", href: "icnf102-subnetting/",
          desc: "Traditional subnetting worked step by step — explains the method as you solve it, not just the answer." },
        { label: "Subnetting Long Questions", tag: "Exam", href: "icnf102-subnet-exam/",
          desc: "20 exam-style long questions, from the past-paper question to VLSM. Type your answers to have them marked, then reveal the memo one step at a time." },
        { label: "Long Questions Practice", tag: "Exam", href: "icnf102-long-questions/",
          desc: "54 practice questions for every other long-question type: conversions, IPv6 and EUI-64, the TCP handshake, encapsulation, ping/traceroute scenarios, SLAAC, config scenarios. Calculations auto-marked; explanations marked against a memo." }
      ]
    },
    {
      code: "WRAV102 / MSEV102",
      name: "Semester Test 2 theory",
      tint: "#3C6E63",
      tintDark: "#7FC2B2",
      sites: [
        { label: "Theory Drill", tag: "Quiz", href: "wrav102-drill/",
          desc: "100 questions — sorting algorithms, searching, classes/arraylists, code tracing." }
      ]
    },
    {
      code: "STAV102",
      name: "Business Statistics — Semester Test 2",
      tint: "#0F5B8C",
      tintDark: "#7DB8E0",
      sites: [
        { label: "Study Guide", tag: "Guide", href: "stav102-study-guide/",
          desc: "Units 5–8: probability distributions, sampling distributions, confidence intervals, hypothesis tests. Worked examples, lecture-video notes, errata, 7-day plan." },
        { label: "MCQ Drill", tag: "Quiz", href: "stav102-quiz/",
          desc: "68 questions with explanations. Test-sim mode (20 random) and a redo-what-I-got-wrong mode." },
        { label: "Explained MCQs", tag: "Quiz", href: "stav102-explained-mcq/",
          desc: "50 questions with every answer explained, and the trap to avoid. Skim the answers, or hide them and test yourself." },
        { label: "Mock Papers", tag: "Mock", href: "stav102-mock-papers/",
          desc: "Two full 90-minute tests in the real layout (long questions + 20 MCQs) with mark-by-mark memos." },
        { label: "Cheat Sheet", tag: "Sheet", href: "stav102-cheat-sheet/",
          desc: "One page: which distribution, which interval, which test, critical values and conclusion templates." }
      ]
    },
    {
      code: "IAUT202",
      name: "Introduction to Automation",
      tint: "#5B4B8A",
      tintDark: "#B3A6DB",
      sites: [
        { group: "1. Theory and robotics", label: "Question 1 Quiz", tag: "Quiz", href: "iaut202-quiz/",
          desc: "100 easy questions on the short-answer theory: control systems, sensors, PLCs, logic gates. Every answer explained, plus a memorise mode with the answers shown." },
        { group: "1. Theory and robotics", label: "Likely Question 1 (50)", tag: "Quiz", href: "iaut202-likely-q1/",
          desc: "50 questions on the topics most likely to come up in Question 1: open and closed loop, logic and sequence control, levels of automation, PLC vs PC, gates, actuators." },
        { group: "1. Theory and robotics", label: "ADC and Number Systems Quiz", tag: "Quiz", href: "iaut202-adc-quiz/",
          desc: "Question 2 (6 marks): computed successive approximation conversions (digital code and encoded voltage), resolution, quantisation error and binary, decimal and hex conversions." },
        { group: "1. Theory and robotics", label: "Robotics Quiz (79)", tag: "Quiz", href: "iaut202-robotics-quiz/",
          desc: "Question 4: the five joint types (L, O, R, T, V), the five robot configurations, wrist and drives, sensors, the four control types, end effectors, programming, and control resolution, accuracy and repeatability." },
        { group: "2. PLC", label: "PLC Quiz", tag: "Quiz", href: "iaut202-plc-quiz/",
          desc: "Question 3 groundwork: scan cycle, contacts, seal-in and latches, on-delay and off-delay timers, counters, flashers, and turning a scenario into logic." },
        { group: "2. PLC", label: "PLC Scenario Practice (6)", tag: "Practice", href: "iaut202-plc-scenarios/",
          desc: "Six packaging and conveyor scenarios in the style of Question 3 (25 marks), each with an I/O table and full logic memo: carton line, crate line, labeller, shrink-wrap tunnel, two-conveyor accumulator, pallet layer counter." },
        { group: "3. Pneumatics", label: "Pneumatics Quiz", tag: "Quiz", href: "iaut202-pneumatics-quiz/",
          desc: "Question 5 groundwork: cylinders and valves, port numbers, sequence notation, the cascade method and the drawing conventions." },
        { group: "3. Pneumatics", label: "Pneumatic Cascade Practice (9)", tag: "Practice", href: "iaut202-pneumatics-practice/",
          desc: "Nine sequences to group and turn into an electrical cascade, each with a memo giving the groups, relay set and reset conditions and the solenoid table. One has a 3 s delay and one has four cylinders." },
        { group: "4. Mock exams", label: "Mock Exam Papers A, B and C", tag: "Mock exam", href: "iaut202-practice-paper/",
          desc: "Three full 95-mark papers in the exam layout, worded like the make-up paper: theory as 20 multiple-choice questions, a 5-bit ADC (6), a PLC scenario with I/O table and sequence of operation (25), robotics with robot pictures (20) and a hand-drawn pneumatic cascade with a lamp (24). Each question has a memo that opens on tap." },
        { group: "4. Mock exams", label: "Mixed Mock Quiz (64)", tag: "Mock exam", href: "iaut202-mock-quiz/",
          desc: "A mixed set drawn from every exam part (theory, ADC, PLC, robotics, pneumatics). Filter by part or run all of it as a quick mock." }
      ]
    }
  ];

  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  // Each module carries both tints (--a-l / --a-d); the CSS below picks one per theme, so a theme change needs no re-render.
  var css = MODULES.map(function(m,i){ return '#mod'+i+',#jump'+i+'{--a-l:'+m.tint+';--a-d:'+m.tintDark+'}'; }).join("")
    + '.jump{--m:var(--a-l)}'
    + '@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="paper"]) .module,:root:not([data-theme="light"]):not([data-theme="paper"]) .jump{--m:var(--a-d)}}'
    + ':root[data-theme="dark"] .module,:root[data-theme="dark"] .jump{--m:var(--a-d)}';
  var st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);

  var shelf = "", jump = "", total = 0;
  MODULES.forEach(function(mod,i){
    total += mod.sites.length;
    jump += '<a class="jump" href="#mod'+i+'" id="jump'+i+'">'+esc(mod.code.split(" / ")[0])+'</a>';
    shelf += '<section class="module" role="listitem" id="mod'+i+'">'
      + '<div class="module-index" aria-hidden="true">0'+(i+1)+'</div>'
      + '<div class="module-head"><div><p class="module-code">'+esc(mod.code)+'</p>'
      + '<h2>'+esc(mod.name)+'</h2></div>'
      + '<span class="page-count">'+mod.sites.length+' page'+(mod.sites.length===1?'':'s')+'</span></div>'
      + '<div class="pages">';
    var lastGroup = null;
    mod.sites.forEach(function(s){
      if(s.group && s.group !== lastGroup){ lastGroup = s.group; shelf += '<h3 class="sec">'+esc(s.group)+'</h3>'; }
      shelf += '<a class="page" href="'+esc(s.href)+'">'
        + '<span class="type-tag">'+esc(s.tag)+'</span>'
        + '<span class="page-copy"><strong>'+esc(s.label)+'</strong><small>'+esc(s.desc)+'</small></span>'
        + '<svg class="go" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>'
        + '</a>';
    });
    shelf += '</div></section>';
  });
  document.getElementById("shelf").innerHTML = shelf;
  document.getElementById("jump").innerHTML = jump;
  document.getElementById("stats").textContent = MODULES.length + " modules · " + total + " pages";

  var themeBtn = document.getElementById("themebtn");
  var THEME_KEY = "school_stuff_theme", order = ["auto","light","dark","paper"];
  var icons = {
    auto:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
    light:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    paper:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>'
  };
  var theme = "auto";
  try{ theme = localStorage.getItem(THEME_KEY) || "auto"; }catch(e){}
  if(order.indexOf(theme) < 0) theme = "auto";
  function applyTheme(){
    if(theme==="auto"){ document.documentElement.removeAttribute("data-theme"); }
    else { document.documentElement.setAttribute("data-theme", theme); }
    themeBtn.innerHTML = icons[theme] + '<span>' + theme + '</span>';
    themeBtn.title = "Theme: " + theme + " (click to change)";
    themeBtn.setAttribute("aria-label", "Theme: " + theme + ". Click to change");
  }
  applyTheme();
  themeBtn.onclick = function(){
    theme = order[(order.indexOf(theme)+1) % order.length];
    applyTheme();
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  };
})();
</script>
</body>
</html>
