<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Stuff</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light dark;
  --paper:#F1ECE1; --surf:#FAF7EF; --surf2:#EAE3D2;
  --ink:#211B12; --ink2:#5B5240; --ink3:#8B826C;
  --line:#D8CFB8; --line2:#C2B896;
  --code:#E9E1CB;
  --f-disp:"Newsreader",Georgia,serif;
  --f-ui:"Work Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#171410; --surf:#1D1912; --surf2:#252017;
    --ink:#EDE7D8; --ink2:#B8AF9B; --ink3:#847C68;
    --line:#3A3325; --line2:#4A4130;
    --code:#221D14;
  }
}
:root[data-theme="dark"]{
  --paper:#171410; --surf:#1D1912; --surf2:#252017;
  --ink:#EDE7D8; --ink2:#B8AF9B; --ink3:#847C68;
  --line:#3A3325; --line2:#4A4130;
  --code:#221D14;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;letter-spacing:-.005em;margin:0;text-wrap:balance}
code{font-family:var(--f-mono)}

.top{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto;padding:22px 20px 0}
.top .mark{width:26px;height:26px;flex:none;border:1.5px solid var(--ink);border-radius:50%;display:grid;
  place-items:center;font-family:var(--f-mono);font-size:11px}
.top .kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.top .sp{flex:1}
.themebtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--surf);
  color:var(--ink2);cursor:pointer;display:grid;place-items:center;flex:none}
.themebtn:hover{background:var(--surf2);color:var(--ink)}

.wrap{max-width:760px;margin:0 auto;padding:18px 20px 60px}

.hero{padding-block:22px 30px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(30px,6vw,42px)}
.hero p{margin:12px 0 0;color:var(--ink2);font-size:16.5px;max-width:56ch}

.shelf{padding-block:28px}
.subject{border:1px solid var(--line2);border-radius:10px;background:var(--surf);margin-bottom:18px;overflow:hidden}
.subject-head{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.spine{width:7px;align-self:stretch;border-radius:4px;flex:none;min-height:34px}
.subject-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.subject-code{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;color:var(--tint);font-weight:500}
.subject-name{font-size:19px;font-weight:500}
.subject-count{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--ink3);white-space:nowrap}

.pages{display:flex;flex-direction:column}
.page{display:flex;align-items:center;gap:14px;padding:14px 18px;text-decoration:none;color:var(--ink);
  border-top:1px solid var(--line);transition:background .12s}
.page:first-child{border-top:0}
.page:hover{background:var(--surf2)}
.page:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
.page-tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:99px;border:1px solid var(--tint);color:var(--tint);flex:none;font-weight:500}
.page-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.page-label{font-weight:600;font-size:15.5px;font-family:var(--f-ui);display:block}
.page-desc{font-size:13.5px;color:var(--ink2);line-height:1.4;display:block}
.page-go{font-family:var(--f-mono);font-size:16px;color:var(--ink3);flex:none}
.page:hover .page-go{color:var(--tint)}

.note{border-top:1px solid var(--line);padding-top:24px;margin-top:8px}
.note p{color:var(--ink3);font-size:13.5px;margin:0 0 6px;font-family:var(--f-mono)}

@media (max-width:520px){
  .subject-head{padding:14px 14px}
  .page{padding:12px 14px;gap:11px}
  .subject-name{font-size:17.5px}
  .page-label{font-size:15px}
  .page-tag{display:none}
}
</style>
</head>
<body>

<header class="top">
  <span class="mark" aria-hidden="true">S</span>
  <span class="kicker">School Stuff</span>
  <div class="sp"></div>
  <button class="themebtn" id="themebtn" aria-label="Switch theme" title="Switch theme">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div class="wrap">
  <div class="hero">
    <h1>Pick a module.</h1>
    <p>Study guides and quizzes for each course, kept in one shelf. Every module gets its own page — open one below.</p>
  </div>

  <div class="shelf" id="shelf" role="list"></div>

  <div class="note">
    <p>New modules get added to this shelf as they're built — nothing to configure.</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Add a new module here — one object, no other changes needed.
  var MODULES = [
    {
      code: "ICNF102",
      name: "Communication Network Fundamentals",
      tint: "#9C4A2E",
      tintDark: "#E0916E",
      sites: [
        { label: "Field reference", tag: "Guide", href: "icnf102-study-guide/",
          desc: "21-sheet study guide — explanations, worked examples and cheat sheets. No questions." },
        { label: "Line Test", tag: "Quiz", href: "icnf102-quiz/",
          desc: "200 questions in 8 sets, rising in difficulty. Study and test modes." }
      ]
    },
    {
      code: "WRAV102 / MSEV102",
      name: "Semester Test 2 theory",
      tint: "#3C6E63",
      tintDark: "#7FC2B2",
      sites: [
        { label: "Theory Drill", tag: "Quiz", href: "wrav102-drill/",
          desc: "100 questions — sorting algorithms, searching, classes/arraylists, code tracing." }
      ]
    }
  ];

  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  function currentIsDark(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t === "dark") return true;
    if(t === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function render(){
    var dark = currentIsDark();
    var html = "";
    MODULES.forEach(function(mod){
      var tint = dark ? mod.tintDark : mod.tint;
      html += '<div class="subject" role="listitem" style="--tint:'+tint+'">'
        + '<div class="subject-head">'
        + '<span class="spine" style="background:'+tint+'"></span>'
        + '<span class="subject-id"><span class="subject-code">'+esc(mod.code)+'</span>'
        + '<span class="subject-name">'+esc(mod.name)+'</span></span>'
        + '<span class="subject-count">'+mod.sites.length+' page'+(mod.sites.length===1?'':'s')+'</span>'
        + '</div><div class="pages">';
      mod.sites.forEach(function(s){
        html += '<a class="page" href="'+esc(s.href)+'">'
          + '<span class="page-tag">'+esc(s.tag)+'</span>'
          + '<span class="page-body"><span class="page-label">'+esc(s.label)+'</span>'
          + '<span class="page-desc">'+esc(s.desc)+'</span></span>'
          + '<span class="page-go" aria-hidden="true">→</span>'
          + '</a>';
      });
      html += '</div></div>';
    });
    document.getElementById("shelf").innerHTML = html;
  }

  var themeBtn = document.getElementById("themebtn");
  var THEME_KEY = "school_stuff_theme";
  function applyTheme(t){
    if(t==="light"||t==="dark"){ document.documentElement.setAttribute("data-theme", t); }
    else { document.documentElement.removeAttribute("data-theme"); }
    render();
  }
  var theme = "auto";
  try{ theme = localStorage.getItem(THEME_KEY) || "auto"; }catch(e){}
  applyTheme(theme);
  themeBtn.title = "Theme: " + theme;
  themeBtn.onclick = function(){
    var order = ["auto","light","dark"];
    theme = order[(order.indexOf(theme)+1) % order.length];
    applyTheme(theme);
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    themeBtn.title = "Theme: " + theme;
  };
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      if(theme === "auto") render();
    });
  }
})();
</script>
</body>
</html>
