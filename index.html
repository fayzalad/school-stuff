<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Stuff</title>
<script>
(function(){try{var t=localStorage.getItem("school_stuff_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light dark;
  --paper:#F1ECE1; --surf:#FAF7EF; --surf2:#EAE3D2;
  --ink:#211B12; --ink2:#5B5240; --ink3:#766D58;
  --line:#D8CFB8; --line2:#C2B896;
  --f-disp:"Newsreader",Georgia,serif;
  --f-ui:"Work Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,48px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#171410; --surf:#1D1912; --surf2:#252017;
    --ink:#EDE7D8; --ink2:#B8AF9B; --ink3:#9A917B;
    --line:#3A3325; --line2:#4A4130;
  }
}
:root[data-theme="dark"]{
  --paper:#171410; --surf:#1D1912; --surf2:#252017;
  --ink:#EDE7D8; --ink2:#B8AF9B; --ink3:#9A917B;
  --line:#3A3325; --line2:#4A4130;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}

.top,.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gut)}
.top{display:flex;align-items:center;gap:12px;padding-top:22px}
.top .mark{width:30px;height:30px;flex:none;border:1.5px solid var(--ink);border-radius:50%;display:grid;
  place-items:center;font-family:var(--f-mono);font-size:12px}
.top .kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.top .sp{flex:1}
.themebtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--surf);
  color:var(--ink2);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.themebtn:hover{background:var(--surf2);color:var(--ink)}
.themebtn:focus-visible,.jump a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.wrap{padding-block:12px 72px}

.hero{padding-block:28px 26px}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.05}
.hero p{margin:14px 0 0;color:var(--ink2);font-size:clamp(16.5px,1.6vw,19px);max-width:60ch}
.stats{margin-top:16px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;color:var(--ink3)}

.jump{display:flex;flex-wrap:wrap;gap:8px;padding-block:0 26px;border-bottom:1px solid var(--line)}
.jump a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid var(--line2);
  border-radius:99px;background:var(--surf);color:var(--ink);text-decoration:none;font-family:var(--f-mono);
  font-size:12.5px;letter-spacing:.04em}
.jump a:hover{background:var(--surf2)}
.jump i{width:9px;height:9px;border-radius:50%;background:var(--tint);flex:none}

.shelf{columns:520px 2;column-gap:22px;padding-block:28px 8px}
.subject{--tint:var(--t-l);border:1px solid var(--line2);border-radius:12px;background:var(--surf);overflow:hidden;
  scroll-margin-top:16px;break-inside:avoid;margin-bottom:22px}
.subject-head{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.spine{width:7px;align-self:stretch;border-radius:4px;flex:none;min-height:38px;background:var(--tint)}
.subject-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.subject-code{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.07em;color:var(--tint);font-weight:500}
.subject-name{font-size:clamp(19px,2vw,23px);font-weight:500;font-family:var(--f-disp);line-height:1.25}
.subject-count{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--ink3);white-space:nowrap}

.pages{display:flex;flex-direction:column}
.page{display:flex;align-items:center;gap:14px;padding:16px 20px;min-height:56px;text-decoration:none;color:var(--ink);
  border-top:1px solid var(--line);transition:background .12s}
.page:first-child{border-top:0}
.page:hover{background:var(--surf2)}
.page:focus-visible{outline:2px solid var(--tint);outline-offset:-2px}
.page-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.page-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 8px;border-radius:99px;border:1px solid var(--tint);color:var(--tint);flex:none;font-weight:500}
.page-label{font-weight:600;font-size:16.5px}
.page-desc{font-size:14.5px;color:var(--ink2);line-height:1.5}
.page-go{font-family:var(--f-mono);font-size:18px;color:var(--ink3);flex:none}
.page:hover .page-go{color:var(--tint)}

.note{padding-top:6px}
.note p{color:var(--ink3);font-size:13.5px;margin:0;font-family:var(--f-mono)}

@media (min-width:1200px){
  body{font-size:18px}
  .page-label{font-size:17.5px}
  .page-desc{font-size:15.5px}
}
@media (max-width:520px){
  .subject-head{padding:14px}
  .page{padding:14px;gap:10px}
  .subject{margin-bottom:16px}
  .subject-count{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.page{transition:none}}
</style>
</head>
<body>

<header class="top">
  <span class="mark" aria-hidden="true">S</span>
  <span class="kicker">School Stuff</span>
  <div class="sp"></div>
  <button class="themebtn" id="themebtn" type="button" aria-label="Switch theme" title="Switch theme"></button>
</header>

<div class="wrap">
  <div class="hero">
    <h1>Pick a module.</h1>
    <p>Study guides and quizzes for each course, kept in one shelf. Every module gets its own page — open one below.</p>
    <div class="stats" id="stats"></div>
  </div>

  <nav class="jump" id="jump" aria-label="Jump to a module"></nav>

  <div class="shelf" id="shelf" role="list"></div>

  <div class="note">
    <p>New modules get added to this shelf as they're built — nothing to configure.</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Add a new module here — one object, no other changes needed.
  var MODULES = [
    {
      code: "ICNF102",
      name: "Communication Network Fundamentals",
      tint: "#9C4A2E",
      tintDark: "#E0916E",
      sites: [
        { label: "Field reference", tag: "Guide", href: "icnf102-study-guide/",
          desc: "21-sheet study guide — explanations, worked examples and cheat sheets. No questions." },
        { label: "Line Test", tag: "Quiz", href: "icnf102-quiz/",
          desc: "200 questions in 8 sets, rising in difficulty. Study and test modes." },
        { label: "Subnet Bench", tag: "Drill", href: "icnf102-subnetting/",
          desc: "Traditional subnetting worked step by step — explains the method as you solve it, not just the answer." },
        { label: "Subnetting Long Questions", tag: "Exam", href: "icnf102-subnet-exam/",
          desc: "20 exam-style long questions, from the past-paper question to VLSM. Type your answers to have them marked, then reveal the memo one step at a time." },
        { label: "Long Questions Practice", tag: "Exam", href: "icnf102-long-questions/",
          desc: "54 practice questions for every other long-question type: conversions, IPv6 and EUI-64, the TCP handshake, encapsulation, ping/traceroute scenarios, SLAAC, config scenarios. Calculations auto-marked; explanations marked against a memo." }
      ]
    },
    {
      code: "WRAV102 / MSEV102",
      name: "Semester Test 2 theory",
      tint: "#3C6E63",
      tintDark: "#7FC2B2",
      sites: [
        { label: "Theory Drill", tag: "Quiz", href: "wrav102-drill/",
          desc: "100 questions — sorting algorithms, searching, classes/arraylists, code tracing." }
      ]
    },
    {
      code: "STAV102",
      name: "Business Statistics — Semester Test 2",
      tint: "#0F5B8C",
      tintDark: "#7DB8E0",
      sites: [
        { label: "Study Guide", tag: "Guide", href: "stav102-study-guide/",
          desc: "Units 5–8: probability distributions, sampling distributions, confidence intervals, hypothesis tests. Worked examples, lecture-video notes, errata, 7-day plan." },
        { label: "MCQ Drill", tag: "Quiz", href: "stav102-quiz/",
          desc: "68 questions with explanations. Test-sim mode (20 random) and a redo-what-I-got-wrong mode." },
        { label: "Explained MCQs", tag: "Quiz", href: "stav102-explained-mcq/",
          desc: "50 questions with every answer explained, and the trap to avoid. Skim the answers, or hide them and test yourself." },
        { label: "Mock Papers", tag: "Mock", href: "stav102-mock-papers/",
          desc: "Two full 90-minute tests in the real layout (long questions + 20 MCQs) with mark-by-mark memos." },
        { label: "Cheat Sheet", tag: "Sheet", href: "stav102-cheat-sheet/",
          desc: "One page: which distribution, which interval, which test, critical values and conclusion templates." }
      ]
    },
    {
      code: "IAUT202",
      name: "Introduction to Automation",
      tint: "#5B4B8A",
      tintDark: "#B3A6DB",
      sites: [
        { label: "Question 1 Quiz", tag: "Quiz", href: "iaut202-quiz/",
          desc: "100 easy questions on the short-answer theory: control systems, sensors, PLCs, logic gates. Every answer explained, plus a memorise mode with the answers shown." },
        { label: "Likely Question 1 (50)", tag: "Quiz", href: "iaut202-likely-q1/",
          desc: "50 questions on the topics most likely to come up, in the style of past Question 1 papers: open and closed loop, logic and sequence control, levels of automation, PLC vs PC, gates, actuators. Quiz and memorise modes." }
      ]
    }
  ];

  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  // Each module sets both tints; the CSS picks one, so a theme change needs no re-render.
  var tintCss = MODULES.map(function(m,i){
    return '#mod'+i+'{--t-l:'+m.tint+';--t-d:'+m.tintDark+'}';
  }).join("")
    + '@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .subject,:root:not([data-theme="light"]) .jump a{--tint:var(--t-d)}}'
    + ':root[data-theme="dark"] .subject,:root[data-theme="dark"] .jump a{--tint:var(--t-d)}'
    + '.jump a{--tint:var(--t-l)}';
  var st = document.createElement("style"); st.textContent = tintCss; document.head.appendChild(st);

  var shelf = "", jump = "", total = 0;
  MODULES.forEach(function(mod,i){
    total += mod.sites.length;
    jump += '<a href="#mod'+i+'" id="jump'+i+'" style="--t-l:'+mod.tint+';--t-d:'+mod.tintDark+'"><i></i>'+esc(mod.code)+'</a>';
    shelf += '<section class="subject" role="listitem" id="mod'+i+'">'
      + '<div class="subject-head">'
      + '<span class="spine"></span>'
      + '<span class="subject-id"><span class="subject-code">'+esc(mod.code)+'</span>'
      + '<h2 class="subject-name">'+esc(mod.name)+'</h2></span>'
      + '<span class="subject-count">'+mod.sites.length+' page'+(mod.sites.length===1?'':'s')+'</span>'
      + '</div><div class="pages">';
    mod.sites.forEach(function(s){
      shelf += '<a class="page" href="'+esc(s.href)+'">'
        + '<span class="page-body"><span class="page-top"><span class="page-tag">'+esc(s.tag)+'</span>'
        + '<span class="page-label">'+esc(s.label)+'</span></span>'
        + '<span class="page-desc">'+esc(s.desc)+'</span></span>'
        + '<span class="page-go" aria-hidden="true">→</span>'
        + '</a>';
    });
    shelf += '</div></section>';
  });
  document.getElementById("shelf").innerHTML = shelf;
  document.getElementById("jump").innerHTML = jump;
  document.getElementById("stats").textContent = MODULES.length + " modules · " + total + " pages";

  var themeBtn = document.getElementById("themebtn");
  var THEME_KEY = "school_stuff_theme", order = ["auto","light","dark"];
  var icons = {
    auto:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
    light:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
  };
  var theme = "auto";
  try{ theme = localStorage.getItem(THEME_KEY) || "auto"; }catch(e){}
  function applyTheme(){
    if(theme==="light"||theme==="dark"){ document.documentElement.setAttribute("data-theme", theme); }
    else { document.documentElement.removeAttribute("data-theme"); }
    themeBtn.innerHTML = icons[theme];
    themeBtn.title = "Theme: " + theme + " (click to change)";
    themeBtn.setAttribute("aria-label", "Theme: " + theme + ". Click to change");
  }
  applyTheme();
  themeBtn.onclick = function(){
    theme = order[(order.indexOf(theme)+1) % order.length];
    applyTheme();
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  };
})();
</script>
</body>
</html>
