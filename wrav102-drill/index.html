<style>
  :root{
    --ground:#f5f7fa; --surface:#ffffff; --surface2:#eef1f6;
    --ink:#161920; --muted:#5b6472; --line:#dde2ea;
    --accent:#2f4fd8; --accent-soft:#e6ebfd;
    --good:#0e7a54; --good-soft:#e2f4ec;
    --bad:#b23a30; --bad-soft:#fbe9e7;
    --shadow:0 1px 2px rgba(20,25,40,.06),0 8px 24px rgba(20,25,40,.05);
  }
  @media (prefers-color-scheme:dark){

      --ground:#111319; --surface:#191c24; --surface2:#20242e;
      --ink:#e9ecf2; --muted:#98a1b1; --line:#2b313d;
      --accent:#8098ff; --accent-soft:#1e2540;
      --good:#43c491; --good-soft:#12291f;
      --bad:#ff7b6f; --bad-soft:#2d1917;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --ground:#111319; --surface:#191c24; --surface2:#20242e;
    --ink:#e9ecf2; --muted:#98a1b1; --line:#2b313d;
    --accent:#8098ff; --accent-soft:#1e2540;
    --good:#43c491; --good-soft:#12291f;
    --bad:#ff7b6f; --bad-soft:#2d1917;

  }

  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.6;

  }
  .wrap{max-width:820px; margin:0 auto; padding-inline:20px; padding-block:0 64px}

  header{padding-block:32px 20px; border-bottom:1px solid var(--line)}
  .eyebrow{
    font-family:Sora,system-ui,sans-serif; font-size:11px; font-weight:600;

  }
  h1{
    font-family:Sora,system-ui,sans-serif; font-size:clamp(26px,5vw,36px);

    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;

  }

  .tab[aria-selected="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}

  }

  }

  .q{

  }

    font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:600;
    color:var(--accent); background:var(--accent-soft);

  }
  .qtext{margin:0; font-size:16.5px; text-wrap:pretty}
  pre{

  }

  .exp{

  }
  .exp b{font-family:Sora,system-ui,sans-serif; font-size:11px; letter-spacing:.1em;

  footer{
    margin-top:32px; padding-top:20px; border-top:1px solid var(--line);
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between
  }
  .btn{
    font-family:Sora,system-ui,sans-serif; font-size:13px; font-weight:600;
    background:var(--surface); color:var(--ink); border:1px solid var(--line);

  }

<body>
<div class="wrap">
  <header>
    <p class="eyebrow">WRAV102 / MSEV102 &middot; Semester Test 2</p>
    <h1>Theory Drill</h1>
    <p class="sub">100 questions across four sets, on the Section A topics: sorting algorithms, searching and sorted state, class structure, and code tracing. Answers save automatically, so a refresh keeps your place.</p>
  </header>

  <nav>
    <div class="tabs" id="tabs" role="tablist"></div>
  </nav>

  <div class="setbar">
    <h2 class="setname" id="setname"></h2>
    <span class="setmeta" id="setmeta"></span>
  </div>

  <div id="questions"></div>

  <footer>
    <p class="note" id="note"></p>
    <button class="btn" id="reset">Clear this set</button>
  </footer>
</div>

<script>
const SETS = [
  {name:"Sorting algorithms", short:"Sorting"},
  {name:"Searching &amp; sorted state", short:"Searching"},
  {name:"Classes, lists and files", short:"Structure"},
  {name:"Tracing and applied", short:"Tracing"}
];

const Q = [
// ---------- SET 1 : SORTING (1-25) ----------
{q:"What is the fundamental comparison mechanism of Bubble Sort?",o:["It compares each element to the smallest found so far","It compares adjacent pairs and swaps them if they are in the wrong order","It inserts each element into a sorted sub-list","It splits the list in half and compares the halves"],a:1,e:"Bubble sort repeatedly compares each pair of ADJACENT elements and swaps them when they are out of order. That adjacency is what distinguishes it from selection and insertion sort."},
{q:"After the first complete pass of an ascending Bubble Sort, what is guaranteed?",o:["The smallest value is in position 0","The list is half sorted","The largest value is in the last position","Nothing is guaranteed after one pass"],a:2,e:"Each pass bubbles the largest remaining value to the end. After pass k, the last k elements are in their final places."},
{q:"In the standard implementation, the inner loop runs to List.Count - 1 - pass. Why does the upper bound shrink each pass?",o:["To avoid an index out of range error","Because the end of the list is already sorted and need not be compared again","Because the list gets shorter as elements are removed","To make the algorithm stable"],a:1,e:"After each pass the next largest value is already parked at the end, so re-comparing that tail is wasted work. Shrinking the bound skips it."},
{q:"What happens if you use List.Count - 1 as the inner bound on every pass instead of subtracting pass?",o:["The list sorts incorrectly","An exception is thrown","It still sorts correctly but does unnecessary comparisons","Only the first pass runs"],a:2,e:"The result is still correct. The cost is efficiency: you repeatedly compare a tail that is already in final order."},
{q:"Selection Sort, sorting ascending, does what on each pass?",o:["Swaps every adjacent out-of-order pair","Finds the smallest value in the unsorted part and swaps it to the front of that part","Inserts the next value into the sorted part","Reverses the unsorted part"],a:1,e:"Selection sort keeps a sorted part on the left. Each pass scans the unsorted remainder for the minimum and swaps it into the boundary position."},
{q:"How many swaps does Selection Sort perform per pass?",o:["One","As many as there are out-of-order pairs","None","Two"],a:0,e:"It performs at most one swap per pass, after locating the minimum. This is why it moves less data than bubble sort."},
{q:"In Insertion Sort, which part of the list is kept sorted?",o:["The right-hand part","The middle","The left-hand (lower) part","Neither, it sorts in place randomly"],a:2,e:"Insertion sort grows a sorted sub-list at the front. Each new element is taken from the unsorted side and inserted into its correct place in that sorted front."},
{q:"When implementing Insertion Sort on an ArrayList, which two built-in methods does the lecture use?",o:["Add and Remove","RemoveAt and Insert","Sort and Reverse","Push and Pop"],a:1,e:"The object is taken out of its old slot with RemoveAt(pass) and put back in the right place with Insert(curPos + 1, newOne)."},
{q:"Why does Insertion Sort need extra code when you use a plain array instead of an ArrayList?",o:["Arrays cannot hold objects","An array has no RemoveAt or Insert, so you must shuffle elements yourself","Arrays are always sorted already","You cannot use a while loop with an array"],a:1,e:"With an array you write List[curPos + 1] = List[curPos] inside the loop to shuffle elements up, then drop the new one into the gap."},
{q:"For a list of n elements, how many passes does the outer loop of these sorts perform?",o:["n","n - 1","n + 1","n / 2"],a:1,e:"You need one less pass than the number of elements: for (int pass = 1; pass <= List.Count - 1; pass++)."},
{q:"To change an ascending sort into a descending sort, what must change?",o:["The loop bounds","Only the comparison in the if or while condition","The Swop method","The number of passes"],a:1,e:"The structure is identical. Only the comparison flips, for example > becomes < on a number field."},
{q:"Sorting a string field into ascending order with Bubble Sort, the swap condition is:",o:["a.CompareTo(b) > 0","a.CompareTo(b) < 0","a.Equals(b)","a > b"],a:0,e:"CompareTo returns greater than 0 when the first string comes after the second alphabetically, so that pair is out of ascending order and must swap."},
{q:"Which of the three sorting algorithms does NOT use a Swop helper method?",o:["Bubble Sort","Selection Sort","Insertion Sort","All three use it"],a:2,e:"Insertion sort does not swap pairs. It removes one element and re-inserts it, or shuffles elements up in an array."},
{q:"Bubble Sort can be optimised with a boolean flag. What does that achieve?",o:["Worst case becomes O(n)","Best case becomes O(n) on an already sorted list","It becomes a stable sort","It removes the need for the inner loop"],a:1,e:"If a whole pass completes with no swaps the list is already sorted, so you stop. On sorted input that is a single pass, O(n)."},
{q:"Bubble Sort and Selection Sort share which worst-case time complexity?",o:["O(n)","O(n log n)","O(n squared)","O(log n)"],a:2,e:"Both use nested loops over the list, so both are O(n^2) in the worst case."},
{q:"Why is Bubble Sort generally slower in practice than Selection Sort, despite the same complexity class?",o:["It uses more memory","It performs far more swaps (data movement)","It needs the list pre-sorted","It cannot sort strings"],a:1,e:"Both do a similar number of comparisons, but bubble sort swaps on every out-of-order adjacent pair while selection sort swaps at most once per pass."},
{q:"Where should the sortedState variable be updated?",o:["Inside the private sorting algorithm","In the public Sort method that calls the algorithm","In the application class after sorting","In the object class"],a:1,e:"Lecture 08b is explicit: sorted state is not part of the algorithm. Set it in the public method so the algorithm stays a faithful implementation."},
{q:"Array: 45 12 78 33 9 61. After pass 1 of ascending SELECTION sort, the array is:",o:["9 12 78 33 45 61","12 45 33 9 61 78","9 12 33 45 61 78","45 12 78 33 9 61"],a:0,e:"The minimum is 9 at position 4. It swaps with the leftmost unsorted element, 45 at position 0. Everything else stays put."},
{q:"Array: 45 12 78 33 9 61. After pass 1 of ascending BUBBLE sort, the array is:",o:["9 12 78 33 45 61","12 45 33 9 61 78","12 45 78 33 9 61","45 12 33 78 9 61"],a:1,e:"Compare and swap adjacent pairs left to right: 45/12 swap, 45/78 no, 78/33 swap, 78/9 swap, 78/61 swap. 78 ends up at the back."},
{q:"Array: 17 19 54 26 61 9. After pass 1 of DESCENDING Selection Sort, the array is:",o:["9 19 54 26 61 17","61 19 54 26 17 9","19 17 54 26 61 9","17 19 54 26 61 9"],a:1,e:"Descending selection sort looks for the maximum. That is 61 at position 4, which swaps with the leftmost unsorted element 17 at position 0."},
{q:"Why does the module ask you to hand-code sorts rather than use Array.Sort?",o:["Array.Sort is not available in C#","Array.Sort cannot sort objects","Built-in sorting cannot sort on different fields chosen at runtime","Hand-coded sorts are always faster"],a:2,e:"Lecture 07b opens with exactly this: CompareTo fixes one field, so the built-in methods cannot sort on a field of the user's choosing."},
{q:"The lecture says: do NOT adapt the algorithm. What does that mean in practice?",o:["Never write your own sort","Implement the published algorithm as it is, for your scenario","Always copy code from the internet","Use only one sort per program"],a:1,e:"Sorting algorithms are standard and widely published. You change the field being compared and the object type, not the algorithm's structure."},
{q:"In Selection Sort, after Swop(pass - 1, minPos), what happens to minPos?",o:["It is reset to 0","It is set to pass","It is left unchanged","It is decremented"],a:1,e:"minPos = pass moves the pointer to the start of the newly shortened unsorted part, ready for the next scan."},
{q:"In Selection Sort's inner loop, where does the scan start?",o:["At position 0 every pass","At position pass","At position pass - 1","At the end of the list"],a:1,e:"for (int x = pass; x <= List.Count - 1; x++) scans only the unsorted remainder, which starts at index pass."},
{q:"Which sort would benefit most from the boolean-flag optimisation on a list that is already sorted?",o:["Selection Sort","Insertion Sort","Bubble Sort","None of them"],a:2,e:"Only bubble sort can detect sortedness cheaply: a pass with zero swaps proves the list is ordered, so it stops after one pass."},

// ---------- SET 2 : SEARCHING (26-50) ----------
{q:"What does a Linear Search do?",o:["Halves the list repeatedly","Checks each element in turn from the start until a match or the end","Jumps to the middle first","Sorts the list, then searches"],a:1,e:"Linear search traverses the list one element at a time. It works on any list, sorted or not."},
{q:"What precondition must hold before a Binary Search is correct?",o:["The list must contain at least 10 items","The list must be sorted on the same field being searched","The list must be an array, not an arraylist","The list must be sorted in ascending order only"],a:1,e:"Sorted is not enough on its own: it must be sorted ON THE FIELD you are searching. A list sorted by surname is no help when searching by number."},
{q:"What happens if you run a Binary Search on a list that violates the precondition?",o:["It throws an exception","It falls back to a linear search automatically","It may report not found even though the item is present","It always returns position 0"],a:2,e:"The algorithm discards half the list based on a comparison that is meaningless for an unsorted field, so it can walk away from the item. The failure is silent, which is what makes it dangerous."},
{q:"What is the first thing Binary Search compares?",o:["The first element","The last element","The middle element","A random element"],a:2,e:"It computes mid = (first + last) / 2 and compares the wanted value with the element there."},
{q:"Searching an ASCENDING list, the wanted value is greater than the middle value. What happens?",o:["first = mid + 1","last = mid - 1","first = 0","The search ends"],a:0,e:"In ascending order the larger values are in the second half, so the first half is discarded by moving first past mid."},
{q:"Searching a DESCENDING list, the wanted value is greater than the middle value. What happens?",o:["first = mid + 1","last = mid - 1","Nothing changes","The search ends"],a:1,e:"This is the classic trap. In a descending list the larger values are at the FRONT, so you keep the first half: last = mid - 1."},
{q:"Which three variables does a hand-coded Binary Search need?",o:["low, high, count","first, last, mid","start, end, found","pos, nrEl, wanted"],a:1,e:"first and last mark the part of the list still being searched; mid is recalculated each time round the loop."},
{q:"What is the loop condition of a Binary Search?",o:["while (first < last)","while (first <= last)","while (mid != wanted)","while (first != last)"],a:1,e:"while (first <= last) keeps going while the search region still holds at least one element. When first passes last, the item is not there."},
{q:"A private LinearSearch or BinarySearch method returns what when the item is not found?",o:["0","-1","null","The list count"],a:1,e:"The private search methods work in 0-based positions and return -1 for not found. The conversion happens in the public Find method."},
{q:"What does the public Find method return to the application class?",o:["The 0-based position, or -1","The 1-based position, or 0","true or false","The object itself"],a:1,e:"Find returns pos + 1. If the search returned -1, that becomes 0, which is the application class's not-found signal."},
{q:"sortedState = 0 means:",o:["The list is empty","The list is sorted ascending","The list is not sorted","The list has one element"],a:2,e:"0 is the not-sorted state. Every other value names a specific field and direction."},
{q:"The list is sorted ascending by SURNAME. The user searches by student NUMBER. Which search runs?",o:["Binary search","Linear search","Either works equally","No search is possible"],a:1,e:"The list is sorted on the wrong field for this search, so binary search is invalid. Fall back to linear."},
{q:"Which String method answers a yes/no question about whether two strings match?",o:["CompareTo","Equals","Compare","Contains"],a:1,e:"Equals returns true or false. CompareTo returns a number describing ORDER, which is what you need for sorting and binary search."},
{q:"\"John\".CompareTo(\"Peter\") returns:",o:["A value less than 0","Exactly -1","0","A value greater than 0"],a:0,e:"John comes before Peter alphabetically, so the result is less than 0. Note the lecture's warning: do not assume the exact value is -1, test with < 0."},
{q:"CompareTo returning exactly 0 means:",o:["The first string comes first","The strings are equal","The second string comes first","The comparison failed"],a:1,e:"0 means equal, less than 0 means the first comes before, greater than 0 means the first comes after."},
{q:"Which action resets sortedState to 0?",o:["Deleting an element","Adding a new element to the end of the list","Displaying the list","Searching the list"],a:1,e:"A new element on the end breaks any existing order. Display and search do not change the order at all."},
{q:"Does deleting an element from a sorted list change the sorted state?",o:["Yes, it must reset to 0","No, the remaining elements keep their order","Only if it was the first element","Only for arrays"],a:1,e:"Removing an element does not disturb the relative order of what is left, so the list is still sorted."},
{q:"The list is sorted on class mark. The user updates a student's test mark, changing the class mark. What must happen?",o:["Nothing","sortedState resets to 0","The list re-sorts automatically","sortedState becomes 1"],a:1,e:"The value the list was ordered by has changed, so the list may no longer be in order. Reset to 0 so later searches use a linear search."},
{q:"The list is sorted on student number. The user updates a student's test mark. What happens to sortedState?",o:["It resets to 0","It stays as it is","It becomes 2","It becomes -1"],a:1,e:"The mark is not the field the list is ordered by, so the ordering is untouched. Only updates to the SORT field invalidate the state."},
{q:"Why is Binary Search faster than Linear Search on a large sorted list?",o:["It uses less memory","It halves the remaining search space with every comparison","It uses a faster loop type","It checks two elements at a time"],a:1,e:"Each comparison eliminates half of what is left, so the number of comparisons grows logarithmically rather than linearly."},
{q:"Where should the sortedState variable be declared?",o:["As a public field in the application class","As a private field in the list class","As a local variable in Main","In the object class"],a:1,e:"It describes the state of the whole list, so it is a private field of the list class, exposed only through the methods that use it."},
{q:"Which method decides whether to use binary or linear search?",o:["The private BinarySearch method","The public Find method","Main","The object class"],a:1,e:"Find reads sortedState and delegates to the appropriate private search method. The application class never has to know which was used."},
{q:"In the application class, what return value indicates the item was not found?",o:["-1","0","null","false"],a:1,e:"The list class converts -1 into 0 before returning. The application class checks if (pos == 0), never if (pos == -1)."},
{q:"On a 10-element sorted list, roughly how many comparisons does a binary search need in the worst case?",o:["10","5","4","1"],a:2,e:"Each comparison halves the range: 10, 5, 2, 1. That is about 4 comparisons, against up to 10 for a linear search."},
{q:"A list is sorted DESCENDING by passenger number. Searching by passenger number, which search should run?",o:["Linear search, because binary needs ascending","A descending variant of binary search","No search is possible","Binary search, unchanged"],a:1,e:"Binary search works on any consistent ordering. You just flip which half is discarded, which is why a well-written list class has both an ascending and a descending binary search."},

// ---------- SET 3 : STRUCTURE (51-75) ----------
{q:"Which class holds the loops that walk through the whole list?",o:["The object class","The list class","The application class","Any of them"],a:1,e:"All loops and all arraylist or array operations belong in the list class. The object class deals with a single object."},
{q:"Which class holds all Console.ReadLine prompts and feedback messages?",o:["The object class","The list class","The application class","The object class and list class equally"],a:2,e:"Anything involving user input or user-facing messages belongs in the application class, which then calls list class methods."},
{q:"In the LIST class, the first position in the list is:",o:["Position 0","Position 1","Position -1","Whatever nrEl says"],a:0,e:"The list class works in the natural 0-based indexing of the underlying array or arraylist."},
{q:"In the APPLICATION class, the first position in the list is presented as:",o:["Position 0","Position 1","Position -1","Position nrEl"],a:1,e:"Users count from 1. That is why Find adds 1 before returning and Get subtracts 1 before using the position."},
{q:"Where should the 0-based to 1-based position adjustment happen?",o:["In the application class, before displaying","Inside the list class methods","In the object class","In the text file"],a:1,e:"The list class adds 1 before returning a position and subtracts 1 before using one. The application class should never reason about 0-indexing."},
{q:"Why is a calculated field such as selling price given its own private method?",o:["To make the class longer","Because it is called from more than one place: the constructor and the mutator","Because C# requires it","To hide it from the list class"],a:1,e:"Lecture 03b states the rule: if you need to calculate something in two different places, make it a method."},
{q:"A class stores cost price, mark-up and selling price. What must SetCostPrice do?",o:["Only assign the new cost price","Assign the new cost price and recalculate the selling price","Recalculate the mark-up","Write the change to the text file"],a:1,e:"Selling price is derived from cost price. Forgetting to recalculate is the single most commonly lost mark in these papers."},
{q:"A data file has some lines with 5 fields and some with 4. What does this require?",o:["Two Split calls","Two constructors in the object class, and a ReadData that chooses between them","A try/catch block","Deleting the short lines"],a:1,e:"One constructor takes every value; the overload omits the missing one and assigns a default. ReadData inspects each line and calls the right one."},
{q:"How does ReadData decide which constructor to call?",o:["By checking fields.Length","By counting the commas manually","By trying one and catching the error","By the line number"],a:0,e:"Split returns an array, so fields.Length tells you how many fields that particular line held."},
{q:"Which using directive does an ArrayList require?",o:["using System.IO;","using System.Collections;","using System.Linq;","using System.Text;"],a:1,e:"ArrayList lives in System.Collections. StreamReader and StreamWriter need System.IO."},
{q:"Why is a cast such as ((Passenger)List[x]) needed with an ArrayList?",o:["To convert the text to a number","Because an ArrayList stores plain objects, so the compiler needs to be told the real type","To copy the object","It is not needed, it is optional styling"],a:1,e:"An ArrayList is untyped. Without the cast you cannot reach GetSurname or any other method of the class."},
{q:"When you store objects in a plain array instead of an ArrayList, what extra variable do you need?",o:["A sortedState variable","An nrEl counter for how many positions are in use","A found flag","A delimiter constant"],a:1,e:"An array has a fixed Length but you may be using only part of it, so you track the number in use yourself."},
{q:"What check does an array-backed Add need that an arraylist Add does not?",o:["Whether the list is sorted","Whether the array is full (nrEl equals List.Length)","Whether the object is null","Whether the file is open"],a:1,e:"An array has fixed capacity, so you check before adding. An arraylist grows on its own."},
{q:"How do you delete an element from the middle of an array of objects?",o:["Set that position to null","Shuffle every later element down one place, then decrease nrEl","Call RemoveAt","Sort the array first"],a:1,e:"for (int x = pos - 1; x <= nrEl - 2; x++) List[x] = List[x + 1]; then nrEl--. That leaves no hole and no duplicate."},
{q:"How is the delimiter declared in the lecturer's text-file pattern?",o:["char DELIM = ',';","const char DELIM = ',';","string DELIM = \",\";","No variable, the comma is typed inline"],a:1,e:"const char DELIM = ',' at the top of ReadData, then inputLine.Split(DELIM)."},
{q:"What is the loop condition when reading a text file line by line?",o:["while (sr.EndOfStream)","while (inputLine != null)","while (inputLine != \"\")","for each line in file"],a:1,e:"ReadLine returns null when there are no more lines, so while (inputLine != null) is the standard pattern."},
{q:"Should WriteData write out a calculated field such as selling price?",o:["Yes, always","No, because it was never in the input file and is recalculated on reading","Only if the list is sorted","Only for arraylists"],a:1,e:"The output must match the input format. The calculated field is derived, so writing it would change the format and duplicate information."},
{q:"A method must display every product containing a given allergen. Which approach is correct?",o:["Call Find and display the result","Loop the whole list with a bool found flag, displaying each match","Sort the list, then display the first match","Use binary search"],a:1,e:"Find returns only ONE position. When several elements can match you must traverse the whole list, and a flag lets you report when nothing matched."},
{q:"Why can't you use the Find method for a multi-match display?",o:["Find is private","Find only ever returns a single position","Find needs a sorted list","Find returns a bool"],a:1,e:"Find is built to locate one item. A filter that can produce many results needs its own loop."},
{q:"The mark for an unassessed student is stored as -1. Which calculations must exclude it?",o:["Only the average","The average, the highest and the lowest","Only the highest","None, -1 is harmless"],a:1,e:"A -1 would drag the average down and would always win as the minimum. Every statistic over marks must skip unassessed records."},
{q:"How should a bool field such as 'available' be displayed when the question asks for words?",o:["Console.WriteLine(Available)","With an if-else that chooses the text, then display the text","Cast the bool to a string","Store it as a string instead"],a:1,e:"The 2023 Car paper insisted on this: never print true/false when the spec asks for Available or Rented Out."},
{q:"Which format specifier displays a value as currency?",o:["{0:F2}","{0:C}","{0:N}","{0:D}"],a:1,e:"{0:C} formats as currency. {0:F2} gives a plain number to two decimal places."},
{q:"Where does the private WriteData method normally get called from?",o:["The constructor","A public Close method, invoked before the program quits","Every Add","ReadData"],a:1,e:"Close is the public wrapper; the application class calls it as the final action before terminating."},
{q:"What should Delete(int Pos) guard against before touching the list?",o:["Nothing, the caller checked already","Negative numbers, zero, and positions beyond the end of the list","Only zero","Only positions beyond the end"],a:1,e:"Defensive bounds checking is explicitly marked. Validate after the Pos-- adjustment and before indexing."},
{q:"A private field with public Get and Set methods demonstrates which principle?",o:["Inheritance","Polymorphism","Encapsulation","Abstraction"],a:2,e:"The data is hidden behind methods, so the class controls how it is read and changed. That is why a Set can also recalculate a derived field."},

// ---------- SET 4 : TRACING (76-100) ----------
{q:"Bubble sort inner loop: for (int x = 0; x <= List.Count - 1 - pass; x++). With Count = 6 and pass = 1, what is the last value of x?",o:["6","5","4","3"],a:2,e:"6 - 1 - 1 = 4. So x runs 0,1,2,3,4 and compares List[4] with List[5], the last valid adjacent pair."},
{q:"In the insertion sort while loop, the loop stops when:",o:["curPos reaches 0","curPos is -1, OR the new value is no longer smaller than the current one","The list is sorted","pass equals Count"],a:1,e:"while ((curPos != -1) && (newOne.GetAmount() < currentOne.GetAmount())). Either running off the front, or finding the insert point, ends it."},
{q:"After the insertion sort loop, why is the object inserted at curPos + 1 and not curPos?",o:["To leave a blank space","Because curPos has been decremented one step too far","Because positions are 1-based here","It is a known bug in the lecture code"],a:1,e:"The loop decrements curPos once more after finding the right place, so the correct insert slot is one position back to the right."},
{q:"The Find method ends with return pos + 1. Find returns 0. What did the private search return?",o:["0","1","-1","null"],a:2,e:"-1 + 1 = 0. That is exactly how the not-found signal is converted for the application class."},
{q:"Spot the bug in this application-class code:",c:"int pos = pasList.FindPassenger(wanted);\nif (pos != -1)\n{\n    Passenger cur = pasList.GetPassenger(pos);\n    cur.DisplayPassenger();\n}",o:["GetPassenger should take pos - 1","The test should be pos != 0, because Find returns 0 when not found","FindPassenger should be private","pos should be a double"],a:1,e:"Find already converted -1 into 0. Testing against -1 means the not-found case slips through and GetPassenger is called with 0."},
{q:"Spot the bug:",c:"int total = 0;\nfor (int x = 0; x <= List.Count - 1; x++)\n{\n    total = total + ((Student)List[x]).GetMark();\n}\nreturn total / List.Count;",o:["The loop bound is wrong","total should be a double, otherwise the average is truncated","It should be total * List.Count","List.Count should be nrEl"],a:1,e:"An int total forces whole-number division, so an average of 70.6 comes back as 70. Declare total as double."},
{q:"A running-maximum method starts its loop at x = 1, not x = 0. Why?",o:["Position 0 is reserved","Position 0 is taken as the current maximum before the loop starts","Arrays start at 1 in C#","To skip the header row"],a:1,e:"int maxPos = 0; then compare every later element against it. Starting at 0 would just compare it with itself."},
{q:"A list contains marks where -1 means not yet assessed. What does an unguarded running-MINIMUM return?",o:["The lowest real mark","-1, because it is smaller than every real mark","0","An exception"],a:1,e:"The sentinel wins the comparison every time. Any statistic over marks must skip records where the mark is -1."},
{q:"What does (0 + 9) / 2 evaluate to in C# when both operands are int?",o:["4.5","5","4","4.0"],a:2,e:"Integer division truncates toward zero, so 9 / 2 is 4. This is exactly what you want for a binary search mid."},
{q:"This loop is meant to add a passenger while keeping an ascending list sorted. What does it compute?",c:"int pos = 0;\nwhile ((pos <= List.Count - 1) &&\n       (newOne.GetID() > ((Passenger)List[pos]).GetID()))\n{\n    pos++;\n}\nList.Insert(pos, newOne);",o:["The position of a matching ID","The first position whose ID is not smaller than the new one","The last position in the list","The midpoint of the list"],a:1,e:"It walks forward while the new ID still belongs further on, stopping at the first element that should come after it. Inserting there preserves the order."},
{q:"After the AddInOrder method above runs on a list with sortedState = 1, what should sortedState become?",o:["0, because the list changed","It stays 1, because the order was preserved","2","-1"],a:1,e:"That is the whole point of inserting in position. Contrast with a plain Add on the end, which must reset the state to 0."},
{q:"ReadData reads a line and Split returns 4 fields where most lines have 5. What should happen?",o:["Skip the line","Call the overloaded constructor that assigns a default for the missing value","Throw an error message","Pad the line with a zero"],a:1,e:"if (fields.Length == 5) use the full constructor, else use the overload. The missing field gets its sentinel or default."},
{q:"What does this Display code print when TestMark is -1.0?",c:"if (TestMark == -1.0)\n{\n    Console.WriteLine(\"Not yet assessed\");\n}\nelse\n{\n    Console.WriteLine(\"{0:F1}\", TestMark);\n}",o:["-1.0","Not yet assessed","0.0","Nothing"],a:1,e:"The sentinel is intercepted before formatting, so the reader sees words rather than a meaningless -1."},
{q:"A method must return true only for students who passed AND have been assessed. Which condition is right?",o:["mark >= 50","mark >= 50 && mark != -1","mark > 50 || mark != -1","mark != -1"],a:1,e:"Checking the mark alone is not enough, though in practice -1 already fails >= 50. Being explicit documents the intent and protects against a changed pass mark."},
{q:"In Selection Sort, Swop(pass - 1, minPos) swaps with position pass - 1. Why that position?",o:["It is the last element","It is the boundary: the first position of the unsorted part","It is always the minimum","It is a randomly chosen pivot"],a:1,e:"On pass 1 the boundary is position 0, on pass 2 it is position 1, and so on. The sorted part grows from the left."},
{q:"A binary search on an ascending list contains: else if (result > 0) { last = mid - 1; }. What is wrong?",o:["Nothing, it is correct","It should be first = mid + 1 for an ascending list","result should be compared with 1","last should be mid"],a:1,e:"This is the descending-list assignment used on an ascending list. It discards the wrong half and the search fails silently on about half the lookups."},
{q:"Which statement about Delete and sorted order is true?",o:["Delete always breaks the sorted order","Delete preserves the order of the remaining elements","Delete requires re-sorting afterwards","Delete only works on unsorted lists"],a:1,e:"Removing one element leaves everything else in the same relative order, so the sorted state survives untouched."},
{q:"A menu-driven program uses which loop structure?",o:["for (int i = 0; i < 10; i++)","while (choice != quitOption)","do-while (true)","foreach over the menu"],a:1,e:"Read a choice, then loop while it is not the quit option, reading a fresh choice at the end of each iteration."},
{q:"CountInRange(50, 74) should count elements where:",o:["mark > 50 and mark < 74","mark >= 50 and mark <= 74","mark >= 50 only","mark == 50 or mark == 74"],a:1,e:"An inclusive range uses >= for the low bound and <= for the high bound, so the boundary values are counted."},
{q:"Which statement about {0:F2} is correct?",o:["It adds a currency symbol","It formats the number to two decimal places","It rounds to a whole number","It right-aligns the value"],a:1,e:"F2 is fixed-point with two decimals. Use C for currency, which adds the symbol and the thousands separators."},
{q:"An array-backed insertion sort contains List[curPos + 1] = List[curPos]; inside the while loop. What is this line doing?",o:["Swapping two elements","Shuffling the current element up one place to open a gap","Deleting the current element","Copying the new element into place"],a:1,e:"It is the array's substitute for RemoveAt and Insert. Each step moves one element up, and the gap that remains receives the new object after the loop."},
{q:"Which of these belongs in the OBJECT class?",o:["A loop that displays all products","A method returning true if this product is on special","The ReadData method","The menu"],a:1,e:"A yes/no question about ONE object belongs with that object. The list class then calls it inside its loop."},
{q:"An application-class method declares int pos = 0; before calling Find. Why is that a bad habit here?",o:["0 is the not-found signal, so an untouched variable looks like a real result","C# forbids initialising to 0","It wastes memory","Positions must start at 1"],a:0,e:"Declare it from the call instead: int pos = pasList.FindPassenger(wanted). Never pre-seed it with a value that already means something."},
{q:"A list class method returns the Passenger at a 1-based position. What is the first thing it should do?",o:["Sort the list","Decrement the position with Pos--","Check sortedState","Call Find"],a:1,e:"Convert to 0-based, then validate the bounds, then index. The adjustment belongs here, not in the caller."},
{q:"Which sequence correctly describes the application class handling an update?",o:["Prompt for the new value, then search","Search first, check pos == 0, then prompt for the new value and update","Update first, then search to confirm","Sort, then update"],a:1,e:"Do not ask the user for data you may not need. Find the item, report an error if it does not exist, and only then prompt for the new value."}
];

// ---- state ----
const KEY="wrav102-theory-drill-v1";
let state={set:0,answers:{}};
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&typeof p==="object"){state.set=Number(p.set)||0; state.answers=p.answers||{};}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const tabsEl=document.getElementById("tabs");
const qEl=document.getElementById("questions");
const nameEl=document.getElementById("setname");
const metaEl=document.getElementById("setmeta");
const noteEl=document.getElementById("note");
const LETTERS=["A","B","C","D"];

function setRange(s){return [s*25, s*25+25];}

function scoreFor(s){
  const [lo,hi]=setRange(s);
  let done=0,right=0;
  for(let i=lo;i<hi;i++){
    if(state.answers[i]!==undefined){done++; if(state.answers[i]===Q[i].a) right++;}
  }
  return {done,right};
}

function renderTabs(){
  tabsEl.innerHTML="";
  SETS.forEach((s,i)=>{
    const {done,right}=scoreFor(i);
    const b=document.createElement("button");
    b.className="tab"; b.type="button"; b.role="tab";
    b.setAttribute("aria-selected", i===state.set?"true":"false");
    b.innerHTML=s.short+' <span class="score">'+(done?right+"/"+done:"0/25")+'</span>';
    b.addEventListener("click",()=>{state.set=i; save(); render();});
    tabsEl.appendChild(b);
  });
}

function renderQuestions(){
  const [lo,hi]=setRange(state.set);
  const {done,right}=scoreFor(state.set);
  nameEl.innerHTML=(state.set+1)+". "+SETS[state.set].name;
  metaEl.textContent="Q"+(lo+1)+"–"+hi+"  ·  "+done+" answered  ·  "+right+" correct";
  noteEl.textContent=done===25
    ? "Set complete: "+right+" out of 25."
    : (25-done)+" left in this set. Progress is saved as you go.";

  qEl.innerHTML="";
  for(let i=lo;i<hi;i++){
    const item=Q[i];
    const card=document.createElement("div"); card.className="q";

    const head=document.createElement("div"); head.className="qhead";
    const num=document.createElement("span"); num.className="qnum"; num.textContent=String(i+1).padStart(3,"0");
    const txt=document.createElement("p"); txt.className="qtext"; txt.textContent=item.q;
    head.appendChild(num); head.appendChild(txt); card.appendChild(head);

    if(item.c){const pre=document.createElement("pre"); pre.textContent=item.c; card.appendChild(pre);}

    const opts=document.createElement("div"); opts.className="opts";
    const chosen=state.answers[i];
    item.o.forEach((text,oi)=>{
      const b=document.createElement("button");
      b.className="opt"; b.type="button";
      b.innerHTML='<span class="letter">'+LETTERS[oi]+'</span><span></span>';
      b.lastChild.textContent=text;
      if(chosen!==undefined){
        b.disabled=true;
        if(oi===item.a) b.classList.add("correct");
        else if(oi===chosen) b.classList.add("wrong");
      }else{
        b.addEventListener("click",()=>{state.answers[i]=oi; save(); render();});
      }
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(chosen!==undefined){
      const exp=document.createElement("div"); exp.className="exp";
      const lab=document.createElement("b");
      lab.textContent = chosen===item.a ? "Correct" : "Answer: "+LETTERS[item.a];
      const p=document.createElement("span"); p.textContent=item.e;
      exp.appendChild(lab); exp.appendChild(p); card.appendChild(exp);
    }
    qEl.appendChild(card);
  }
}

function render(){renderTabs(); renderQuestions();}

document.getElementById("reset").addEventListener("click",()=>{
  const [lo,hi]=setRange(state.set);
  for(let i=lo;i<hi;i++) delete state.answers[i];
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
});

render();
</script>
